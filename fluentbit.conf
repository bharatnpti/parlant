[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /var/log/parlant/*.log
    Parser            json
    Tag               parlant.*
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

[FILTER]
    Name                modify
    Match               parlant.*
    Add                 service_name parlant
    Add                 environment production
    Add                 cluster_name parlant-cluster

[FILTER]
    Name                record_modifier
    Match               parlant.*
    Record              hostname ${HOSTNAME}
    Record              pod_name ${POD_NAME}
    Record              namespace ${NAMESPACE}

[OUTPUT]
    Name                opensearch
    Match               parlant.*
    Host                opensearch-cluster.example.com
    Port                9200
    Index               parlant-logs
    Type                _doc
    Logstash_Format     On
    Logstash_Prefix     parlant
    Logstash_DateFormat %Y.%m.%d
    Retry_Limit         6
    Suppress_Type_Name  On
    Include_Tag_Key     On
    Tag_Key             tag
    Buffer_Size         512KB
    HTTP_User           ${OPENSEARCH_USER}
    HTTP_Passwd         ${OPENSEARCH_PASSWORD}
    tls                 On
    tls.verify          On
